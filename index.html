<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞盘球队球员卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- 登录注册 -->
  <div class="page" v-if="!isLoggedIn">
    <div class="box">
      <h2>🏆 飞盘球队系统</h2>
      <div class="tabs">
        <button :class="activeTab === 'login' ? 'active' : ''" @click="activeTab='login'">登录</button>
        <button :class="activeTab === 'register' ? 'active' : ''" @click="activeTab='register'">注册</button>
      </div>

      <div v-if="activeTab === 'login'">
        <input v-model="loginUser" placeholder="账号" />
        <input v-model="loginPwd" type="password" placeholder="密码" />
        <button class="btn" @click="login">登录</button>
      </div>

      <div v-if="activeTab === 'register'">
        <input v-model="regUser" placeholder="账号" />
        <input v-model="regPwd" type="password" placeholder="密码" />
        <input v-model="regAdminKey" placeholder="队长密钥（无则留空）" />
        <button class="btn" @click="register">注册</button>
      </div>
    </div>
  </div>

  <!-- 队员页面 -->
  <div class="page" v-if="isLoggedIn && !user.isAdmin">
    <header>我的球员卡</header>
    <div class="content">
      <div class="avatar">
        <img :src="myInfo.avatar || 'https://ui-avatars.com/api/?name=球员'" alt="">
        <input type="file" accept="image/*" @change="uploadAvatar">
      </div>

      <div class="item">
        <label>场上位置</label>
        <select v-model="myInfo.position">
          <option>全能</option>
          <option>Cutter 切割手</option>
          <option>Handler 持盘手</option>
        </select>
      </div>

      <button class="btn" @click="saveMyInfo">保存我的资料</button>
      <div class="card" :info="myInfo"></div>
    </div>
  </div>

  <!-- 管理员页面 -->
  <div class="page" v-if="isLoggedIn && user.isAdmin">
    <header>队长管理</header>
    <div class="content">
      <div class="add-box">
        <input v-model="newPlayerName" placeholder="输入队员姓名">
        <button class="btn" @click="addPlayer">+ 添加队员</button>
      </div>

      <div class="list">
        <div v-for="p in players" @click="openDetail(p)">
          {{ p.name }}
        </div>
      </div>

      <div class="card" v-if="currentPlayer" :info="currentPlayer"></div>
      <button class="btn" v-if="currentPlayer" @click="closeDetail">返回列表</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<script src="app.js"></script>
</body>
</html>
